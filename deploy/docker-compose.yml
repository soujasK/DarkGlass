# DarkGlass public demo: FalkorDB, the API, the web app and Caddy (automatic HTTPS) on one machine.
#   DOMAIN=demo.example.com docker compose -f deploy/docker-compose.yml up -d --build
# Gemini is off (visitors cannot spend the model budget); the Playbook agent runs the same FalkorDB tools.
# Only Caddy is reachable from outside; FalkorDB and its Browser stay on the internal network.
name: darkglass

services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 15000 TIMEOUT_MAX 120000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      DARKGLASS_FALKORDB_HOST: falkordb
      DARKGLASS_FALKORDB_PORT: "6379"
      DARKGLASS_LLM_ENABLED: "false"
      DARKGLASS_IDLE_RESET_MINUTES: "10"

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  falkordb-data:
  caddy-data:
  caddy-config:
