services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: darkglass-falkordb
    ports:
      - "127.0.0.1:6390:6379"   # Redis protocol, this machine only (host 6390 avoids clashing with a local Redis)
      - "127.0.0.1:3001:3000"   # FalkorDB Browser UI, this machine only
    volumes:
      - falkordb-data:/var/lib/falkordb/data   # the graph survives container restarts
    environment:
      # Bound runaway queries; the agent's queries finish in milliseconds.
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 15000 TIMEOUT_MAX 120000"

volumes:
  falkordb-data:
